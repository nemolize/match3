name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue production deploys so a rapid second push cannot cancel an
  # in-flight deploy; preview uploads are safe to supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pull-requests: write` is needed only by the PR-description steps, which
    # are themselves gated on `github.event_name == 'pull_request'`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ⏳deployment is in progress..."

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: nemolize/actions/setup@ffbe3737f01cb4e563dd19424761da8c3c9a9173 # v1.2.0

      - run: pnpm run build

      - id: deploy
        name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: ${{ github.event_name == 'push' && 'deploy' || 'versions upload' }}

      - if: ${{ github.event_name == 'pull_request' }}
        name: Show preview URL in the PR description
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ${{ steps.deploy.outputs.deployment-url }}"

      - if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: nemolize/actions/upsert@5d31663b9013a671ff8fe8b84900a88b9878f0c1 # v1.5.0
        with:
          marker: preview-url
          body: "Version Preview URL: ❌deployment failed."
